name: run-fetch

on:
  workflow_dispatch:
  push:
    paths:
      - "targets.json"
      - "fetch_tv_data.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Fetch data
        run: python fetch_tv_data.py
      - name: Commit results
        run: |
          git config user.name "fetch-bot"
          git config user.email "bot@github.local"
          git add data/fetch_log.json
          git commit -m "data: fetch results $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push
