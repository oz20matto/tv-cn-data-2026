name: run-fetch

on:
  push:
  create:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --no-input requests || true

      - name: Fetch + publish
        run: |
          set +e
          mkdir -p data/pages
          python -u fetch_tv_data.py 2>&1 | tee data/last_run.txt

      - name: Commit backup files
        run: |
          git config user.name "fetch-bot"
          git config user.email "bot@github.local"
          git add -A data/ || true
          git commit -m "data: backup $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push failed"
